# Publishes a release on a version tag: Linux and Windows binaries attached
# to a GitHub release.
#
# This repository on GitHub is a push mirror of the Forgejo one
# (code.i.xenrelay.com/minifig/scrappy), where development and CI happen
# (.forgejo/workflows/). The tag arrives here with the mirror push;
# .forgejo/workflows/release.yml publishes the same tag to Forgejo's releases.
# This is the only workflow on GitHub, and the only place Windows is built.
#
# Every third-party action is pinned to a full commit SHA with its version in
# a trailing comment; this workflow holds a token that can write releases.
# Bump the SHA and the comment together.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: scrappy
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            exe: scrappy.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libpango1.0-dev libx11-dev libxext-dev libxft-dev libxinerama-dev \
            libxcursor-dev libxrender-dev libxfixes-dev libwayland-dev \
            wayland-protocols libdbus-1-dev libxkbcommon-dev \
            libgl1-mesa-dev libglu1-mesa-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - run: cargo build --release --locked

      - name: Stage the binary
        shell: bash
        run: |
          mkdir -p dist
          name="scrappy-${{ matrix.target }}"
          case "${{ matrix.exe }}" in *.exe) name="$name.exe" ;; esac
          cp "target/release/${{ matrix.exe }}" "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256")

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*

  release:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: binaries-*
          merge-multiple: true

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
